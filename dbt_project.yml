
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'enpal_assessment_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'enpal_assessment_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# One schema per layer, the same names in test (ENPAL_TEST) and prod (ENPAL_ANALYTICS_PROD):
# see macros/generate_schema_name.sql. Staging and intermediate are views, marts are tables.
models:
  enpal_assessment_project:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
  # Elementary's result tables in their own schema (ELEMENTARY)
  elementary:
    +schema: elementary

# Data tests per layer (vault/project/elementary_rollout.md).
# Raw layer: the source YAML and the singular tests on raw data only warn and carry the tag dq_raw.
# Staging layer: the tests on the cleansed data are promises of the pipeline, at error, tag dq_staging.
data_tests:
  enpal_assessment_project:
    sources:
      +severity: warn
      +tags: [dq_raw]
    data_quality:
      +severity: warn
      +tags: [dq_raw]
    staging:
      +severity: error
      +tags: [dq_staging]
    intermediate:
      +severity: error
      +tags: [dq_intermediate]
    marts:
      +severity: error
      +tags: [dq_report]

# Where the raw tables are read from, per target (models/staging/pipedrive/sources/_pipedrive__sources.yml):
#   test -> ENPAL_TEST.SRC, zero-copy clones made by `dbt run-operation refresh_src`
#   prod -> ENPAL_RAW.PIPEDRIVE, read directly
vars:
  # Funnel rules (vault/project/model_plan.md). Open decisions set to Claude's recommendation:
  step_1_date: stage_entry               # open: 'stage_entry' (first entry into stage 1) or 'created' (add_time)
  calls_done_only: true                  # open: steps 2.1 and 3.1 count done calls only
  exclude_duplicate_entry_deals: true    # decided (DUP-6): drop deals with lost reason Duplicate Entry from the funnel
  report_start_month: '2024-01-01'       # open: report window, months with stage events
  report_end_month: '2025-02-01'
  raw_location:
    test: { database: ENPAL_TEST, schema: SRC }
    prod: { database: ENPAL_RAW, schema: PIPEDRIVE }

seeds:
  enpal_assessment_project:
    +schema: seeds
    funnel_steps:
      +column_types:
        funnel_step: varchar
        stage_id: integer
        activity_type: varchar
        sort_order: integer
