version: '3.8'

# Connection settings come from .env (copy .env.example); nothing secret is committed.
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGPORT: ${POSTGRES_PORT:?set in .env}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./raw_data:/raw_data  # Mount raw_data folder to access CSV files
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"

  data_loader:
    image: postgres:latest
    depends_on:
      - db
    volumes:
      - ./raw_data:/raw_data
    entrypoint: /bin/bash /raw_data/load_data.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
    links:
      - db
