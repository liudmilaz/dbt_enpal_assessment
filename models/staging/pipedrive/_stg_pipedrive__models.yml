version: 2

# Staging: one view per raw table, rename / cast only (vault/project/model_plan.md).
# Tests here are promises of the pipeline: severity error, tag dq_staging (dbt_project.yml).
# Known issues of the raw data stay on the sources (models/sources/pipedrive/) and are not repeated here;
# what staging cleans (D6, T1) is tested here as fixed.
# Descriptions hold the business meaning (vault/project/crm_field_definitions.md, business_context.md);
# the stage and activity-type meanings are an interpretation to confirm with Enpal. Cleaning and data quality
# notes are in meta: cleaning, caveats (issue ids of vault/project/cleansing_proposals.md).
# Column meta: source_column = raw column, crm_label = the name users see in Pipedrive.
# Generic tests: unique + not_null on primary and alternate keys, not_null + relationships on foreign keys (no unique:
# a foreign key repeats by definition). Other columns get not_null only where the report filters or dates by them.

models:
  - name: stg_pipedrive__deal_changes
    description: >
      The history of every deal in Enpal's sales pipeline. A deal is one sales opportunity: a household or business
      that might buy or rent a solar system, battery, wallbox, heat pump or an electricity contract. Each row is one
      change of one deal property, as the CRM records it in the deal's history: the deal was created (a lead became
      a deal), assigned to an owner (lead routing, hand-over), moved into a pipeline stage, or closed with a lost reason.
      The export has no deals table, so the deals of the funnel are derived from this history; the first entry of a
      deal into a stage is what the funnel report counts.
    config:
      meta:
        grain: "deal_change_key (= deal_id, changed_field_key, change_time)"
        primary_key: [deal_change_key]
        logical_entity: DEAL_EVENT
        cleaning: "new_value split into one typed column per key (D6)."
        caveats:
          - "D5: change times are generated (creation clock time + whole days); use dates, not durations."
          - "D3: a deal_id can hold two lifecycles, consistent with a duplicate lead merged into one deal."
          - "Only four deal properties are exported; no previous value and no author of a change."
    data_tests:
      - dbt_utils.expression_is_true:
          name: one_typed_value_per_change__stg_deal_changes
          description: "Exactly one typed column is filled per row, the one of its key. A failure means a new key or a cast that returned null."
          arguments:
            expression: >
              (case when deal_created_at is null then 0 else 1 end)
              + (case when owner_user_id is null then 0 else 1 end)
              + (case when stage_id is null then 0 else 1 end)
              + (case when lost_reason_id is null then 0 else 1 end) = 1
          config:
            meta: { issue: D6, quality_dimension: validity }
      - dbt_utils.expression_is_true:
          name: creation_value_equals_change_time__stg_deal_changes
          description: "For add_time, the value is the change time itself , so either can date the creation."
          arguments:
            expression: "deal_created_at = change_time"
          config:
            where: "changed_field_key = 'add_time'"
            meta: { quality_dimension: consistency }
    columns:
      - name: deal_change_key
        description: "Identifies one change of one deal property at one time; built over the deal, the property and the time."
        config:
          meta: { source_column: "derived: hash of deal_id, changed_field_key, change_time", key: primary }
        # unique covers the grain; not_null stays on the three parts, because the hash is never null
        data_tests: [unique, not_null]
      - name: deal_id
        description: "The sales opportunity the change belongs to."
        config:
          meta: { source_column: deal_id, key: "primary (part)" }
        data_tests: [not_null]
      - name: changed_field_key
        description: >
          Which property of the deal changed: add_time (Deal created), user_id (Owner), stage_id (Stage) or
          lost_reason (Lost reason). It decides which of the typed columns below holds the new value.
        config:
          meta: { source_column: changed_field_key }
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: [add_time, user_id, stage_id, lost_reason] }
      - name: change_time
        description: "When the change was made in the CRM."
        config:
          meta: { source_column: change_time }
        data_tests: [not_null]
      - name: new_value
        description: "The value of the property after the change, as recorded; its meaning depends on changed_field_key. Kept for tracing."
        config:
          meta: { source_column: new_value }
      - name: deal_created_at
        description: "Deal created: when a lead became a deal, i.e. the household showed interest (web form, call, partner). Filled on add_time rows only."
        config:
          meta: { source_column: new_value, crm_label: Deal created }
      - name: owner_user_id
        description: "Owner: the person the deal was assigned or re-assigned to (lead routing, hand-over). Filled on user_id rows only."
        config:
          meta: { source_column: new_value, crm_label: Owner }
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pipedrive__users')
                field: user_id
      - name: stage_id
        description: "Stage: the pipeline stage the deal moved into, 1 (Lead Generation) to 9 (Renewal/Expansion). Filled on stage_id rows only."
        config:
          meta: { source_column: new_value, crm_label: Stage }
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pipedrive__stages')
                field: stage_id
      - name: lost_reason_id
        description: >
          Lost reason: the deal was closed as lost, with the reason the rep chose from the admin's list (1 to 5, labels in
          stg_pipedrive__field_options). Filled on lost_reason rows only. It is set on deals that went on to after-sales too, so it is a
          closure label, not a won/lost outcome (D4).
        config:
          meta: { source_column: new_value, crm_label: Lost reason }
        data_tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref('stg_pipedrive__field_options')
                field: option_id
                to_condition: "field_key = 'lost_reason'"

  - name: stg_pipedrive__activity
    description: >
      The work sales reps plan to move a deal forward: calls, consultations and follow-ups. Each row is one planned
      activity, of one type, for one person and one deal. Planned is not held: only is_done says it took place.
      Sales Call 1 (first consultation with the household) is funnel step 2.1, Sales Call 2 (second consultation,
      around the offer) is step 3.1.
    config:
      meta:
        grain: "activity_id"
        primary_key: [activity_id]
        logical_entity: ACTIVITY
        cleaning: "DUP-3: deduplicated on activity_id, keeping the row with the latest due_at (the current version)."
        caveats:
          - "A2: activities rarely match a deal of the deal history, so calls are counted by due month, not per funnel deal."
          - "A4: part of the past activities is never marked done."
          - "X1: the activity export can end earlier than the deal history."
    columns:
      - name: activity_id
        description: "The activity's id in the CRM; deduplicated in staging (DUP-3)."
        config:
          meta: { source_column: activity_id }
        data_tests: [unique, not_null]
      - name: activity_type
        description: "The kind of activity, by its key: meeting = Sales Call 1, sc_2 = Sales Call 2, follow_up = Follow Up Call, after_close_call = After Close Call."
        config:
          meta: { source_column: type }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__activity_types')
                field: activity_type
      - name: assigned_user_id
        description: "The person responsible for doing the activity."
        config:
          meta: { source_column: assigned_to_user }
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__users')
                field: user_id
      - name: deal_id
        description: "The sales opportunity the activity is for."
        config:
          meta: { source_column: deal_id }
        data_tests: [not_null]
      - name: is_done
        description: "Whether the rep marked the activity as done, i.e. it took place. Steps 2.1 and 3.1 count done calls (var calls_done_only)."
        config:
          meta: { source_column: done }
        # not a key, but it filters steps 2.1 and 3.1: a null would silently drop a call (dbt skill, tier 2)
        data_tests: [not_null]
      - name: due_at
        description: "When the activity is planned (date and time); its month is the month of the call in the funnel report."
        config:
          meta: { source_column: due_to }
        # not a key, but it dates the call in the report: a null would silently drop a call (dbt skill, tier 2)
        data_tests: [not_null]

  - name: stg_pipedrive__activity_types
    description: >
      The kinds of activity a rep can plan, set up by the CRM administrator: Sales Call 1 (first consultation),
      Sales Call 2 (second consultation, around the offer), Follow Up Call (a chase or reminder between steps) and
      After Close Call (after the contract: installation, onboarding, satisfaction).
    config:
      meta:
        grain: "activity_type"
        primary_key: [activity_type]
        logical_entity: ACTIVITY_TYPE
        cleaning: "The text flag 'Yes' / 'No' is cast to the boolean is_active (T1)."
        caveats:
          - "T1: an inactive type (for example Follow Up Call) keeps its past activities."
          - "A3: After Close Calls can be due before any deal reached Closing."
    columns:
      - name: activity_type_id
        description: "Technical id of the type."
        config:
          meta: { source_column: id }
        data_tests: [unique, not_null]
      - name: activity_type_name
        description: "The name users see in the CRM: Sales Call 1, Sales Call 2, Follow Up Call, After Close Call."
        config:
          meta: { source_column: name }
      - name: activity_type
        description: "The technical key activities refer to; fixed when the type is created, so it is the join key."
        config:
          meta: { source_column: type }
        data_tests: [unique, not_null]
      - name: is_active
        description: "Whether reps can still choose the type for new activities; old activities keep an inactive type."
        config:
          meta: { source_column: active }

  - name: stg_pipedrive__stages
    description: >
      The sales pipeline: the nine steps a deal goes through, from first interest to after-sales, which are also the
      funnel steps 1 to 9 of the report. Lead Generation (a household shows interest), Qualified Lead (fits a product:
      own roof, region, budget), Needs Assessment (roof, consumption and budget assessed), Proposal/Quote Preparation
      (system designed, rental or purchase offer), Negotiation, Closing (contract signed), Implementation/Onboarding
      (installation and grid connection), Follow-up/Customer Success (after-sales care), Renewal/Expansion (add-ons:
      battery, wallbox, heat pump, electricity contract).
    config:
      meta:
        grain: "stage_id"
        primary_key: [stage_id]
        logical_entity: STAGE
        cleaning: "None; the source spelling is kept."
        caveats:
          - "S1: stage 2 reads 'Qualified lead' here and 'Qualified Lead' in the field options."
          - "D1: deals often skip stages, so stages describe where reps moved the deal, not every step the customer went through."
    columns:
      - name: stage_id
        description: "The position of the step in the pipeline (1 = first); the order of the ids is the order of the funnel."
        config:
          meta: { source_column: stage_id }
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments: { values: [1, 2, 3, 4, 5, 6, 7, 8, 9] }
      - name: stage_name
        description: "The step's name as the sales team sees it, set by the CRM administrator."
        config:
          meta: { source_column: stage_name }

  - name: stg_pipedrive__field_options
    description: >
      The allowed values of the deal's list fields, with the labels users see: the nine stage labels of the Stage
      field and the five lost reasons of the Lost reason field. The lost reasons are Customer Not Ready (interested
      but not now), Pricing Issues (price or financing did not work), Unreachable Customer (stopped answering),
      Product Mismatch (roof, house, consumption or region does not fit) and Duplicate Entry (a second deal for the
      same customer, closed).
    config:
      meta:
        grain: "field_key, option_id"
        primary_key: [field_key, option_id]
        logical_entity: [FIELD_OPTION, LOST_REASON]
        cleaning: "Unpacked from the JSON array fields.field_value_options; fields without a list (Deal created, Owner) have no rows."
        caveats:
          - "DUP-6: Duplicate Entry deals can reach Closing, so duplicates are not caught early."
          - "D4: Unreachable Customer deals can reach Needs Assessment or later, so the reason does not say where a deal stopped."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [field_key, option_id] }
    columns:
      - name: field_key
        description: "The technical name of the deal property the option belongs to: stage_id or lost_reason."
        config:
          meta: { source_column: field_key }
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: [stage_id, lost_reason] }
      - name: field_name
        description: "The property's label in the CRM: Stage, Lost reason."
        config:
          meta: { source_column: name }
      - name: option_id
        description: "The value stored on the deal: the stage id for Stage, the reason id for Lost reason."
        config:
          meta: { source_column: "field_value_options[].id" }
        data_tests: [not_null]
      - name: option_label
        description: "The label users pick in the CRM, for example Negotiation or Pricing Issues."
        config:
          meta: { source_column: "field_value_options[].label" }

  - name: stg_pipedrive__users
    description: >
      The people working in the CRM: sales reps, lead qualifiers, after-sales agents. They own deals and are
      responsible for activities. Current state only: no history of names or emails.
    config:
      meta:
        grain: "user_id"
        primary_key: [user_id]
        logical_entity: USER
        cleaning: "Columns renamed only."
        caveats:
          - "U2: many owners with very few deals each, and users with no deal and no activity: not the shape of a real sales team."
          - "U1: an email can be shared by two users; never join on email."
          - "X1: the user export can end at a different date than the other tables."
    columns:
      - name: user_id
        description: "The person's id; referenced as deal owner (stg_pipedrive__deal_changes.owner_user_id) and as activity assignee."
        config:
          meta: { source_column: id }
        data_tests: [unique, not_null]
      - name: user_name
        description: "The person's name; not unique, so it does not identify a person."
        config:
          meta: { source_column: name }
      - name: email
        description: "The person's login email; not a key."
        config:
          meta: { source_column: email }
      - name: modified_at
        description: "The last change of the user record."
        config:
          meta: { source_column: modified }
