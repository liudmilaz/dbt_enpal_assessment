version: 2

# Intermediate: one business rule or one grain change per model.
# Tests at error, tag dq_intermediate (dbt_project.yml).

models:
  - name: int_pipedrive__deal_cohorts
    description: >
      One row per deal id of the funnel, from the deal history or from the calls, with the month the report counts
      every step of the deal in (the cohort), as Pipedrive's deal conversion report does. A deal of the history
      belongs to its first creation (D3: two creations); Duplicate Entry deals (DUP-6) are left out in staging. The
      calls' deal ids are almost never in the history (A2) and have no creation: they belong to the month of their
      first activity.
    config:
      meta: { grain: deal_id, primary_key: [deal_id], logical_entity: DEAL }
    columns:
      - name: deal_id
        description: "The deal: a deal of the deal history, or a deal id that only the activities know (A2)."
        data_tests: [unique, not_null]
      - name: cohort_at
        description: "The date the cohort is taken from: the first creation (add_time) for a deal of the history, the first activity's due date otherwise. Only the date is reliable (D5)."
        data_tests: [not_null]
      - name: cohort_source
        description: "Where cohort_at comes from: deal_created (deal history) or first_activity (deal id known only from the activities)."
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ['deal_created', 'first_activity'] }
      - name: cohort_month
        description: "First day of the cohort's month: the month the report counts all steps of the deal in."
        data_tests: [not_null]

  - name: int_pipedrive__funnel_events
    description: >
      One row per funnel event at the lowest level: every stage a funnel deal reached (recorded or inferred) and every
      Sales Call 1 or 2 (done or not), put together with union all and enriched with the deal's cohort. The report
      counts from it; the counting rules (for example done calls only) stay in the report.
    config:
      meta: { grain: "event_source, deal_id, funnel_step, activity_id", primary_key: [funnel_event_key], logical_entity: FUNNEL_EVENT }
    columns:
      - name: funnel_event_key
        description: "Surrogate key over event_source, deal_id, funnel_step and activity_id (null for stage entries)."
        data_tests: [unique, not_null]
      - name: event_source
        description: "stage_entry (a stage the deal reached) or sales_call (an activity of type Sales Call 1 or 2)."
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: ['stage_entry', 'sales_call'] }
      - name: funnel_step
        description: "The funnel step of the event: '1' to '9' for stage entries, '2.1' or '3.1' for calls."
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('int_pipedrive__funnel_steps'), field: funnel_step }
      - name: deal_id
        description: "The deal: a funnel deal for stage entries; for calls the activity's own deal id, rarely in the deal history (A2)."
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('int_pipedrive__deal_cohorts'), field: deal_id }
      - name: activity_id
        description: "The call's activity id; null for stage entries."
      - name: event_at
        description: "When the event happened: the stage entry (recorded or inferred), or the call's due time (planned, no completion time in the export). Only the date is reliable (D5)."
        data_tests: [not_null]
      - name: is_inferred
        description: "Stage entries only: true when the stage was skipped in the data and is counted as reached (D1, D2); null for calls."
      - name: is_done
        description: "Calls only: whether the rep marked the call done; null for stage entries."
      - name: is_due_before_export_end
        description: "Calls only: whether the call was due before the export ended (A4); null for stage entries."
      - name: cohort_month
        description: "The month the report counts the event in: the deal's creation month, or for the calls' deal ids the month of their first activity."
        data_tests: [not_null]
      - name: cohort_source
        description: "Where the cohort comes from: deal_created or first_activity."
        data_tests: [not_null]

  - name: int_pipedrive__deal_stage_entries
    description: "One row per funnel deal and recorded stage, dated by the first entry: a re-entry of a stage already entered counts once. Duplicate Entry deals (DUP-6) are already left out in staging."
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id], logical_entity: STAGE_ENTRY }
    columns:
      - name: deal_id
        description: "The funnel deal; Duplicate Entry deals (DUP-6) are left out in staging."
        data_tests: [not_null]
      - name: stage_id
        description: "The pipeline stage the deal entered, 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests: [not_null]
      - name: entered_at
        description: "First recorded entry of this deal into this stage; a later re-entry is ignored."
        data_tests: [not_null]

  - name: int_pipedrive__deal_stage_entries_backfilled
    description: >
      One row per deal and every stage from 1 to the highest it reached (decided: a skipped stage counts as reached).
      Inferred rows (is_inferred) are dated at the earliest recorded entry of any higher stage.
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id], logical_entity: STAGE_ENTRY }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [deal_id, stage_id] }
    columns:
      - name: deal_id
        description: "The funnel deal; Duplicate Entry deals (DUP-6) are left out in staging."
        data_tests:
          - not_null
          # every deal with stage entries has a creation month, so the report's join to the cohorts drops no deal
          - relationships:
              arguments: { to: ref('int_pipedrive__deal_cohorts'), field: deal_id }
      - name: stage_id
        description: "The pipeline stage the deal reached, recorded or inferred: 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_pipedrive__stages'), field: stage_id }
      - name: entered_at
        description: "Recorded entry, or for an inferred stage the earliest recorded entry of any higher stage."
        data_tests: [not_null]
      - name: is_inferred
        description: "True when the stage was skipped in the data and is counted as reached."

  - name: int_pipedrive__funnel_steps
    description: >
      One row per funnel step of the task: steps 1 to 9 are the pipeline stages, named by the Stage field labels;
      steps 2.1 (Sales Call 1, type meeting) and 3.1 (Sales Call 2, type sc_2) are the activity types named Sales Call;
      their step numbers are the task's (no data links a call type to a stage, A2). The step
      number sets the order. The tests pin the task's 11 steps and names, so a changed or missing CRM label fails.
    config:
      meta: { grain: funnel_step, primary_key: [funnel_step], logical_entity: FUNNEL_STEP }
    columns:
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments: { values: ['1', '2', '2.1', '3', '3.1', '4', '5', '6', '7', '8', '9'] }
      - name: kpi_name
        description: "The step's name as the task spells it, for example Lead Generation or Sales Call 1."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Lead Generation
                  - Qualified Lead
                  - Sales Call 1
                  - Needs Assessment
                  - Sales Call 2
                  - Proposal/Quote Preparation
                  - Negotiation
                  - Closing
                  - Implementation/Onboarding
                  - Follow-up/Customer Success
                  - Renewal/Expansion
      - name: source_type
        description: "Where the step is counted from: 'stage' (a pipeline stage entry) or 'activity' (a sales call)."
        data_tests:
          - accepted_values:
              arguments: { values: [stage, activity] }
      - name: stage_id
        description: "The stage of a stage step; null for call steps."
        data_tests:
          - relationships:
              arguments: { to: ref('stg_pipedrive__stages'), field: stage_id }
      - name: activity_type
        description: "The activity type of a call step; null for stage steps."
        data_tests:
          - relationships:
              arguments: { to: ref('stg_pipedrive__activity_types'), field: activity_type }
      - name: sort_order
        description: "Order of the steps in the report, by step number: 1, 2, 2.1, 3, 3.1, 4 to 9."
        data_tests: [unique, not_null]

  - name: int_pipedrive__sales_calls
    description: >
      One row per call of the two funnel call types: Sales Call 1 (meeting, step 2.1) and Sales Call 2 (sc_2, step 3.1).
      deal_id is kept but rarely matches the deal history (A2).
    config:
      meta: { grain: activity_id, primary_key: [activity_id], logical_entity: ACTIVITY }
    columns:
      - name: activity_id
        description: "The call's id in the CRM; deduplicated in staging (A1)."
        data_tests: [unique, not_null]
      - name: funnel_step
        description: "The funnel step the call is: '2.1' for Sales Call 1 (meeting), '3.1' for Sales Call 2 (sc_2)."
        data_tests:
          - accepted_values:
              arguments: { values: ['2.1', '3.1'] }
      - name: activity_type
        description: "The call type: meeting (Sales Call 1) or sc_2 (Sales Call 2)."
      - name: is_done
        description: "Whether the rep marked the call done, i.e. held; the funnel report counts done calls only."
        data_tests: [not_null]
      - name: is_due_before_export_end
        description: >
          Whether the call was due before the export ended (the last change of the deal history). Reps hold calls
          without marking them done (A4); not used by the funnel report, kept to count such calls as held if Enpal confirms.
        data_tests: [not_null]
