version: 2

# Intermediate: one business rule or one grain change per model (vault/project/model_plan.md).
# Tests at error, tag dq_intermediate (dbt_project.yml).

models:
  - name: int_pipedrive__deals
    description: >
      One row per deal, derived from the change history (there is no deals table). created_at is the first
      add_time; first and last owner; last lost reason (a closure label, D4: not an outcome). Known issues are
      handled upstream (D1/D2: backfill, DUP-3: staging dedup) or downstream (DUP-6: funnel exclusion).
    config:
      meta: { grain: deal_id, primary_key: [deal_id] }
    columns:
      - name: deal_id
        description: "The sales opportunity; the deal's id in the CRM, taken from its change history."
        data_tests: [unique, not_null]
      - name: created_at
        description: "First creation time; for a two-lifecycle deal (D3) the first of two."
        data_tests: [not_null]
      - name: first_owner_user_id
        description: "Owner the deal was first assigned to (lead routing); every deal gets one before it enters stage 1."
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_pipedrive__users'), field: user_id }
      - name: last_owner_user_id
        description: "Owner after the last owner change; users holds only the current state, so the history is here."
      - name: first_stage_id
        description: "Stage of the first recorded stage move: expected 1 (step 1 relies on it)."
        data_tests:
          - accepted_values:
              arguments: { values: [1] }
      - name: first_stage_entered_at
        description: "First entry into stage 1, the date of step 1 by default (var step_1_date)."
      - name: highest_stage_id
        description: "Furthest stage recorded; the backfill fills stages 1 to this one."
      - name: is_duplicate_entry
        description: "DUP-6: last lost reason is Duplicate Entry; excluded from the funnel when var exclude_duplicate_entry_deals is true."

  - name: int_pipedrive__funnel_deals
    description: >
      Deals eligible for the funnel report: all deals from int_pipedrive__deals minus Duplicate Entry deals (DUP-6)
      when var exclude_duplicate_entry_deals is true. fct_deals keeps all deals with the flag for the Deals Overview.
    config:
      meta: { grain: deal_id, primary_key: [deal_id] }
    columns:
      - name: deal_id
        description: "The sales opportunity, filtered for funnel eligibility."
        data_tests: [unique, not_null]
      - name: created_at
        description: "First creation time of the deal."
        data_tests: [not_null]
      - name: first_stage_entered_at
        description: "First entry into stage 1."

  - name: int_pipedrive__deal_stage_entries
    description: "One row per deal and recorded stage, dated by the first entry: a re-entry of a stage already entered counts once."
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id] }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [deal_id, stage_id] }
    columns:
      - name: stage_id
        description: "The pipeline stage the deal entered, 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_pipedrive__stages'), field: stage_id }
      - name: entered_at
        description: "First recorded entry of this deal into this stage; a later re-entry is ignored."
        data_tests: [not_null]

  - name: int_pipedrive__deal_stage_entries_backfilled
    description: >
      One row per deal and every stage from 1 to the highest it reached (decided: a skipped stage counts as reached).
      Inferred rows (is_inferred) are dated at the first recorded entry of a higher stage. Reconciled against the
      recorded entries by tests/marts/rep_funnel_reconciles_to_stage_entries.sql.
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id] }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [deal_id, stage_id] }
    columns:
      - name: stage_id
        description: "The pipeline stage the deal reached, recorded or inferred: 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests: [not_null]
      - name: entered_at
        description: "Recorded entry, or for an inferred stage the first recorded entry of a higher stage."
        data_tests: [not_null]
      - name: is_inferred
        description: "True when the stage was skipped in the data and is counted as reached."
        data_tests: [not_null]

  - name: int_pipedrive__sales_calls
    description: >
      One row per call of the two funnel call types: Sales Call 1 (meeting, step 2.1) and Sales Call 2 (sc_2, step 3.1).
      deal_id is kept but rarely matches the deal history (A2).
    config:
      meta: { grain: activity_id, primary_key: [activity_id] }
    columns:
      - name: activity_id
        description: "The call's id in the CRM; deduplicated in staging (DUP-3)."
        data_tests: [unique, not_null]
      - name: funnel_step
        description: "The funnel step the call is: '2.1' for Sales Call 1 (meeting), '3.1' for Sales Call 2 (sc_2)."
        data_tests:
          - accepted_values:
              arguments: { values: ['2.1', '3.1'] }
      - name: is_done
        description: "Whether the call was marked done, i.e. held; the report counts done calls only (var calls_done_only)."
        data_tests: [not_null]

unit_tests:
  - name: backfill_dates_skipped_stages_at_the_next_recorded_entry
    description: "A deal recorded at stages 1 and 4 reaches 2 and 3 as inferred, dated at its stage-4 entry."
    model: int_pipedrive__deal_stage_entries_backfilled
    given:
      - input: ref('int_pipedrive__deal_stage_entries')
        rows:
          - { deal_id: 1, stage_id: 1, entered_at: '2024-01-01 10:00:00', is_inferred: false }
          - { deal_id: 1, stage_id: 4, entered_at: '2024-02-01 10:00:00', is_inferred: false }
      - input: ref('stg_pipedrive__stages')
        rows:
          - { stage_id: 1 }
          - { stage_id: 2 }
          - { stage_id: 3 }
          - { stage_id: 4 }
          - { stage_id: 5 }
    expect:
      rows:
        - { deal_id: 1, stage_id: 1, entered_at: '2024-01-01 10:00:00', is_inferred: false }
        - { deal_id: 1, stage_id: 2, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 1, stage_id: 3, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 1, stage_id: 4, entered_at: '2024-02-01 10:00:00', is_inferred: false }
