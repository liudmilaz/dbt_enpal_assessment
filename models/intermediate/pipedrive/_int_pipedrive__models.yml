version: 2

# Intermediate: one business rule or one grain change per model (vault/project/model_plan.md).
# Tests at error, tag dq_intermediate (dbt_project.yml).

models:
  - name: int_pipedrive__deals
    description: >
      One row per funnel deal, from the change history (there is no deals table). DUP-6 deals (any lost reason
      Duplicate Entry) are left out. D3 (two lifecycles) is handled by first-entry logic in the stage entries.
    config:
      meta: { grain: deal_id, primary_key: [deal_id] }
    columns:
      - name: deal_id
        description: "The sales opportunity; the deal's id in the CRM, taken from its change history."
        data_tests: [unique, not_null]

  - name: int_pipedrive__deal_stage_entries
    description: "One row per deal and recorded stage, dated by the first entry: a re-entry of a stage already entered counts once."
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id] }
    columns:
      - name: deal_id
        description: "The sales opportunity; DUP-6 deals are still here and dropped in int_pipedrive__deals."
        data_tests: [not_null]
      - name: stage_id
        description: "The pipeline stage the deal entered, 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests: [not_null]
      - name: entered_at
        description: "First recorded entry of this deal into this stage; a later re-entry is ignored."
        data_tests: [not_null]

  - name: int_pipedrive__deal_stage_entries_backfilled
    description: >
      One row per deal and every stage from 1 to the highest it reached (decided: a skipped stage counts as reached).
      Inferred rows (is_inferred) are dated at the earliest recorded entry of any higher stage. Reconciled against the
      recorded entries by tests/marts/rep_funnel_reconciles_to_stage_entries.sql.
    config:
      meta: { grain: "deal_id, stage_id", primary_key: [deal_id, stage_id] }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [deal_id, stage_id] }
    columns:
      - name: deal_id
        description: "The sales opportunity; DUP-6 deals are still here and dropped in int_pipedrive__deals."
        data_tests: [not_null]
      - name: stage_id
        description: "The pipeline stage the deal reached, recorded or inferred: 1 (Lead Generation) to 9 (Renewal/Expansion)."
        data_tests: [not_null]
      - name: entered_at
        description: "Recorded entry, or for an inferred stage the earliest recorded entry of any higher stage."
        data_tests: [not_null]
      - name: is_inferred
        description: "True when the stage was skipped in the data and is counted as reached."

  - name: int_pipedrive__funnel_steps
    description: >
      One row per funnel step of the task: steps 1 to 9 are the pipeline stages, named by the Stage field labels;
      steps 2.1 (Sales Call 1, type meeting) and 3.1 (Sales Call 2, type sc_2) are the two call types. The step
      number sets the order. The tests pin the task's 11 steps and names, so a changed or missing CRM label fails.
    config:
      meta: { grain: funnel_step, primary_key: [funnel_step] }
    columns:
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments: { values: ['1', '2', '2.1', '3', '3.1', '4', '5', '6', '7', '8', '9'] }
      - name: kpi_name
        description: "The step's name as the task spells it, for example Lead Generation or Sales Call 1."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Lead Generation
                  - Qualified Lead
                  - Sales Call 1
                  - Needs Assessment
                  - Sales Call 2
                  - Proposal/Quote Preparation
                  - Negotiation
                  - Closing
                  - Implementation/Onboarding
                  - Follow-up/Customer Success
                  - Renewal/Expansion
      - name: source_type
        description: "Where the step is counted from: 'stage' (a pipeline stage entry) or 'activity' (a sales call)."
        data_tests:
          - accepted_values:
              arguments: { values: [stage, activity] }
      - name: stage_id
        description: "The stage of a stage step; null for call steps."
      - name: activity_type
        description: "The activity type of a call step; null for stage steps."
        data_tests:
          - relationships:
              arguments: { to: ref('stg_pipedrive__activity_types'), field: activity_type }
      - name: sort_order
        description: "Order of the steps in the report, by step number: 1, 2, 2.1, 3, 3.1, 4 to 9."
        data_tests: [unique, not_null]

  - name: int_pipedrive__sales_calls
    description: >
      One row per call of the two funnel call types: Sales Call 1 (meeting, step 2.1) and Sales Call 2 (sc_2, step 3.1).
      deal_id is kept but rarely matches the deal history (A2).
    config:
      meta: { grain: activity_id, primary_key: [activity_id] }
    columns:
      - name: activity_id
        description: "The call's id in the CRM; deduplicated in staging (DUP-3)."
        data_tests: [unique, not_null]
      - name: funnel_step
        description: "The funnel step the call is: '2.1' for Sales Call 1 (meeting), '3.1' for Sales Call 2 (sc_2)."
        data_tests:
          - accepted_values:
              arguments: { values: ['2.1', '3.1'] }
      - name: activity_type
        description: "The call type: meeting (Sales Call 1) or sc_2 (Sales Call 2)."
      - name: is_done
        description: "Whether the call was marked done, i.e. held; the funnel report counts done calls only."
        data_tests: [not_null]

unit_tests:
  - name: backfill_dates_skipped_stages_at_the_earliest_higher_entry
    description: >
      Deal 1, recorded at stages 1 and 4, reaches 2 and 3 as inferred, dated at its stage-4 entry. Deal 2, recorded at
      1 (Jan), 5 (Feb) and 3 (Apr, re-opened), reaches 2 and 4 in Feb: the earliest higher entry, not the next stage's.
    model: int_pipedrive__deal_stage_entries_backfilled
    given:
      - input: ref('int_pipedrive__deal_stage_entries')
        rows:
          - { deal_id: 1, stage_id: 1, entered_at: '2024-01-01 10:00:00' }
          - { deal_id: 1, stage_id: 4, entered_at: '2024-02-01 10:00:00' }
          - { deal_id: 2, stage_id: 1, entered_at: '2024-01-01 10:00:00' }
          - { deal_id: 2, stage_id: 5, entered_at: '2024-02-01 10:00:00' }
          - { deal_id: 2, stage_id: 3, entered_at: '2024-04-01 10:00:00' }
      - input: ref('stg_pipedrive__stages')
        rows:
          - { stage_id: 1 }
          - { stage_id: 2 }
          - { stage_id: 3 }
          - { stage_id: 4 }
          - { stage_id: 5 }
    expect:
      rows:
        - { deal_id: 1, stage_id: 1, entered_at: '2024-01-01 10:00:00', is_inferred: false }
        - { deal_id: 1, stage_id: 2, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 1, stage_id: 3, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 1, stage_id: 4, entered_at: '2024-02-01 10:00:00', is_inferred: false }
        - { deal_id: 2, stage_id: 1, entered_at: '2024-01-01 10:00:00', is_inferred: false }
        - { deal_id: 2, stage_id: 2, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 2, stage_id: 3, entered_at: '2024-04-01 10:00:00', is_inferred: false }
        - { deal_id: 2, stage_id: 4, entered_at: '2024-02-01 10:00:00', is_inferred: true }
        - { deal_id: 2, stage_id: 5, entered_at: '2024-02-01 10:00:00', is_inferred: false }
