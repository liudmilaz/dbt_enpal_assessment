version: 2

# Marts: what consumers read. Tests at error, tag dq_report (dbt_project.yml).

models:
  - name: dim_funnel_step
    description: "One row per funnel step of the task: 11 rows (9 stage steps, 2 call steps), from seed funnel_steps. Names are the task's."
    config:
      meta: { grain: funnel_step, primary_key: [funnel_step] }
    columns:
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_tests: [unique, not_null]
      - name: kpi_name
        data_tests: [unique, not_null]
      - name: source_type
        data_tests:
          - accepted_values:
              arguments: { values: [stage, activity] }
      - name: sort_order
        description: "Order of the steps in the report: 1, 2, 2.1, 3, 3.1, 4 to 9."
        data_tests: [unique, not_null]

  - name: rep_sales_funnel_monthly
    description: >
      The task's report: one row per month and funnel step, 2024-01 to 2025-02 (vars report_start_month, report_end_month),
      zero-filled. deals_count: stage steps count distinct deals whose first entry into the stage (recorded or inferred)
      falls in the month; steps 2.1 and 3.1 count distinct deal ids with a call due in the month (done only, var
      calls_done_only), which are not the funnel deals (A2) and are 0 from 2024-10 (X1).
    config:
      contract: { enforced: true }
      meta: { grain: "month, funnel_step", primary_key: [month, funnel_step] }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [month, funnel_step] }
    columns:
      - name: month
        description: "First day of the month."
        data_type: date
        constraints: [{ type: not_null }]
      - name: kpi_name
        description: "The step's name, as in the task: Lead Generation, Qualified Lead, Sales Call 1, ..."
        data_type: varchar
        constraints: [{ type: not_null }]
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_type: varchar
        constraints: [{ type: not_null }]
        data_tests:
          - relationships:
              arguments: { to: ref('dim_funnel_step'), field: funnel_step }
      - name: deals_count
        description: "Deals that reached the step in the month; 0 when none."
        data_type: integer
        constraints: [{ type: not_null }]
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
