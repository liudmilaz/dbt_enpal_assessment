version: 2

# Marts: what consumers read. Tests at error, tag dq_report (dbt_project.yml).

models:
  - name: dim_funnel_step
    description: >
      One row per funnel step of the task (9 stage steps, 2 call steps), from int_pipedrive__funnel_steps, where the
      steps and names are tested. Names are the task's.
    config:
      meta: { grain: funnel_step, primary_key: [funnel_step] }
    columns:
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_tests: [unique, not_null]
      - name: kpi_name
        description: "The step's name as the task spells it, for example Lead Generation or Sales Call 1."
      - name: source_type
        description: "Where the step is counted from: 'stage' (a pipeline stage entry) or 'activity' (a sales call)."
      - name: stage_id
        description: "The stage of a stage step; null for call steps. The report counts stage entries by it."
      - name: sort_order
        description: "Order of the steps in the report: 1, 2, 2.1, 3, 3.1, 4 to 9."

  - name: rep_sales_funnel_monthly
    description: >
      The task's report: one row per month and funnel step, from the first to the last month with any step in the data,
      zero-filled. Stage steps count distinct deals (DUP-6 excluded by int_pipedrive__deals)
      whose first entry into the stage (recorded or inferred) falls in the month; steps 2.1 and 3.1 count distinct
      deal ids with a done call due in the month, which are not the funnel deals (A2)
      and are 0 for months after the activity export ends (X1).
      Built for self-service reporting by month. Quarters, weeks or years belong to the semantic layer or BI tool,
      on the event grain: steps 2.1 and 3.1 are distinct deal ids per month, so summing months double-counts a deal
      with calls in two months.
    config:
      contract: { enforced: true }
      meta:
        grain: "month, funnel_step"
        primary_key: [month, funnel_step]
        # Lightdash: join the step dimension for the funnel order, one metric
        joins:
          - join: dim_funnel_step
            sql_on: ${rep_sales_funnel_monthly.funnel_step} = ${dim_funnel_step.funnel_step}
            fields: [sort_order, source_type]
        metrics:
          total_deals:
            type: sum
            sql: ${TABLE}.deals_count
            label: Deals
            description: >-
              Deals that reached the step in the month. Exact for one month; summed over several months it is exact
              for the stage steps only (steps 2.1 and 3.1 can count a deal once per month).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [month, funnel_step] }
    columns:
      - name: month
        description: "First day of the month."
        data_type: date
        config:
          meta:
            dimension: { type: date, time_intervals: [MONTH] }
        constraints: [{ type: not_null }]
      - name: kpi_name
        description: "The step's name, as in the task: Lead Generation, Qualified Lead, Sales Call 1, ..."
        data_type: varchar
        constraints: [{ type: not_null }]
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_type: varchar
        constraints: [{ type: not_null }]
      - name: deals_count
        description: "Deals that reached the step in the month; 0 when none."
        data_type: integer
        constraints: [{ type: not_null }]
