version: 2

# Marts: what consumers read. Tests at error, tag dq_report (dbt_project.yml).

models:
  - name: dim_funnel_step
    description: "One row per funnel step of the task (9 stage steps, 2 call steps), from seed funnel_steps. Names are the task's."
    config:
      meta: { grain: funnel_step, primary_key: [funnel_step] }
    columns:
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_tests: [unique, not_null]
      - name: kpi_name
        description: "The step's name as the task spells it, for example Lead Generation or Sales Call 1."
        data_tests: [unique, not_null]
      - name: source_type
        description: "Where the step is counted from: 'stage' (a pipeline stage entry) or 'activity' (a sales call)."
        data_tests:
          - accepted_values:
              arguments: { values: [stage, activity] }
      - name: sort_order
        description: "Order of the steps in the report: 1, 2, 2.1, 3, 3.1, 4 to 9."
        data_tests: [unique, not_null]

  - name: rep_sales_funnel_monthly
    description: >
      The task's report: one row per month and funnel step, from var report_start_month to var report_end_month,
      zero-filled. Stage steps count distinct funnel-eligible deals (int_pipedrive__funnel_deals, DUP-6 excluded)
      whose first entry into the stage (recorded or inferred) falls in the month; steps 2.1 and 3.1 count distinct
      deal ids with a call due in the month (done only, var calls_done_only), which are not the funnel deals (A2)
      and are 0 for months after the activity export ends (X1).
    config:
      contract: { enforced: true }
      meta:
        grain: "month, funnel_step"
        primary_key: [month, funnel_step]
        # Lightdash: join the step dimension for the funnel order, one metric
        joins:
          - join: dim_funnel_step
            sql_on: ${rep_sales_funnel_monthly.funnel_step} = ${dim_funnel_step.funnel_step}
            fields: [sort_order, source_type]
        metrics:
          total_deals:
            type: sum
            sql: ${TABLE}.deals_count
            label: Deals
            description: Deals that reached the step, summed over the selected months.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: [month, funnel_step] }
    columns:
      - name: month
        description: "First day of the month."
        data_type: date
        config:
          meta:
            dimension: { type: date, time_intervals: [MONTH, QUARTER, YEAR] }
        constraints: [{ type: not_null }]
      - name: kpi_name
        description: "The step's name, as in the task: Lead Generation, Qualified Lead, Sales Call 1, ..."
        data_type: varchar
        constraints: [{ type: not_null }]
      - name: funnel_step
        description: "Step number as text: '1' to '9', '2.1', '3.1'."
        data_type: varchar
        constraints: [{ type: not_null }]
        data_tests:
          - relationships:
              arguments: { to: ref('dim_funnel_step'), field: funnel_step }
      - name: deals_count
        description: "Deals that reached the step in the month; 0 when none."
        data_type: integer
        constraints: [{ type: not_null }]
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }

  - name: fct_deals
    description: >
      One row per deal with its funnel milestones, for the Deals Overview dashboard. The export has no won/lost
      status and no amount, so "closed" means the deal reached stage 6 (Closing), recorded or inferred.
      lead_month is the cohort: the month of the first entry into stage 1.
    config:
      meta:
        grain: deal_id
        primary_key: [deal_id]
        metrics:
          leads:
            type: count_distinct
            sql: ${TABLE}.deal_id
            label: Leads
            description: Deals that entered the funnel (stage 1).
          closed_deals:
            type: count_distinct
            sql: ${TABLE}.deal_id
            label: Closed deals
            description: Deals that reached Closing (stage 6), recorded or inferred.
            filters:
              - is_closed: true
          conversion_rate:
            type: number
            sql: ${closed_deals} / nullif(${leads}, 0)
            label: Deal conversion rate
            description: Closed deals of a lead cohort divided by its leads.
            format: percent
            round: 1
          avg_sales_cycle_days:
            type: average
            sql: ${TABLE}.days_lead_to_closing
            label: Avg sales cycle (days)
            description: Average days from the first entry into stage 1 to Closing, closed deals only.
            round: 1
    columns:
      - name: deal_id
        description: "The sales opportunity; one row per deal."
        data_tests: [unique, not_null]
      - name: lead_entered_at
        description: "First entry into stage 1 (Lead Generation)."
        data_tests: [not_null]
      - name: lead_month
        description: "Month of the first entry into stage 1: the cohort."
        config:
          meta:
            dimension: { type: date, time_intervals: [MONTH, QUARTER, YEAR] }
      - name: closing_entered_at
        description: "Entry into Closing (stage 6), recorded or inferred; null when the deal did not get there."
      - name: closing_month
        description: "Month of the entry into Closing."
        config:
          meta:
            dimension: { type: date, time_intervals: [MONTH, QUARTER, YEAR] }
      - name: is_closed
        description: "Reached Closing: the closest the export gets to a won deal."
        data_tests: [not_null]
      - name: is_inferred
        description: "True when the stage was skipped in the data and is counted as reached. On fct_deals this applies to Closing (stage 6)."
      - name: days_lead_to_closing
        description: "Days from the first entry into stage 1 to Closing. The timing is generated (D5): read it as an illustration."
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0 }
      - name: highest_stage_id
        description: "Furthest stage reached."
      - name: is_duplicate_entry
        description: "DUP-6: lost reason Duplicate Entry; excluded from the funnel report."
